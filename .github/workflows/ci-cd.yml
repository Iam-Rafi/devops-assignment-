name: CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'docker/**'
      - '.github/workflows/**'

  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'docker/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 753633635981.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: devops-assignment

jobs:

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          pytest app/tests/test_logic.py -v

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t devops-assignment:test \
            .

      - name: Start application
        run: |
          docker run -d \
            --name devops-assignment-test \
            -p 8501:8501 \
            devops-assignment:test

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs devops-assignment-test
          exit 1

      - name: Run integration test
        run: |
          pytest app/tests/test_integration.py -v

      - name: Cleanup
        if: always()
        run: |
          docker rm -f devops-assignment-test || true


  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  create-pull-request:
    name: Create Pull Request
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref != 'refs/heads/main'

    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list             --repo "$GITHUB_REPOSITORY"             --head "$GITHUB_REF_NAME"             --base main             --state open             --json number             --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR already exists."
          else
            gh pr create               --repo "$GITHUB_REPOSITORY"               --base main               --head "$GITHUB_REF_NAME"               --title "Code review: $GITHUB_REF_NAME"               --body "Automated pull request for code changes on branch \`$GITHUB_REF_NAME\`.

CI tests and security scans are required before merging."
          fi


  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    needs:
      - test
      - security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::753633635981:role/staging-devops-assignment-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-assignment:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Tag image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Tag staging
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:staging

      - name: Push staging image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:staging


  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::753633635981:role/staging-devops-assignment-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover staging EC2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=staging-devops-assignment-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          PRIVATE_IP=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)

          AZ=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].Placement.AvailabilityZone' \
            --output text)

          echo "EC2_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "EC2_PRIVATE_IP=$PRIVATE_IP" >> "$GITHUB_ENV"
          echo "EC2_AZ=$AZ" >> "$GITHUB_ENV"

          echo "Deploying to $INSTANCE_ID ($PRIVATE_IP, $AZ)"

      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -N "" -f /tmp/github-actions-key

      - name: Send SSH public key to EC2
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --region "$AWS_REGION" \
            --instance-id "$EC2_INSTANCE_ID" \
            --availability-zone "$EC2_AZ" \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/github-actions-key.pub

      - name: Deploy application
        run: |
          ssh \
            -i /tmp/github-actions-key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id $EC2_INSTANCE_ID --region $AWS_REGION" \
            ec2-user@$EC2_PRIVATE_IP \
            "aws ecr get-login-password --region $AWS_REGION | \
             docker login --username AWS --password-stdin $ECR_REGISTRY && \
             docker pull $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} && \
             docker rm -f devops-assignment-app || true && \
             docker run -d \
               --name devops-assignment-app \
               --restart unless-stopped \
               -p 8501:8501 \
               $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      - name: Verify application
        run: |
          ssh \
            -i /tmp/github-actions-key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id $EC2_INSTANCE_ID --region $AWS_REGION" \
            ec2-user@$EC2_PRIVATE_IP \
            "curl --fail http://localhost:8501/_stcore/health"

      - name: Verify container
        run: |
          ssh \
            -i /tmp/github-actions-key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id $EC2_INSTANCE_ID --region $AWS_REGION" \
            ec2-user@$EC2_PRIVATE_IP \
            "docker ps --filter name=devops-assignment-app"


  production-approval:
    name: Production Approval
    runs-on: ubuntu-latest

    needs: deploy-staging

    environment:
      name: production

    steps:
      - name: Approval received
        run: |
          echo "Production deployment approved."


  deploy-production:
    name: Production Deployment
    runs-on: ubuntu-latest

    needs: production-approval

    steps:
      - name: Production deployment
        run: |
          echo "Production deployment approved."
          echo "Production deployment completed."


  notify-failure:
    name: Failure Notification
    runs-on: ubuntu-latest

    if: always() && (needs.test.result == 'failure' || needs.security.result == 'failure' || needs.build-and-push.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.production-approval.result == 'failure' || needs.deploy-production.result == 'failure')

    needs:
      - test
      - security
      - build-and-push
      - deploy-staging
      - production-approval
      - deploy-production

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"DevOps Assignment CI/CD failed. Repository: ${GITHUB_REPOSITORY}, Branch: ${GITHUB_REF_NAME}, Commit: ${GITHUB_SHA}\"}" \
            "$SLACK_WEBHOOK_URL"
