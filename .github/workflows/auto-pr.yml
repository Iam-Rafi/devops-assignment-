name: Auto PR

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'app/**'
      - 'docker/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR already exists."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title "Code review: $GITHUB_REF_NAME" \
              --body "Automated pull request for code changes. Please review the changes and merge after CI passes."
          fi
